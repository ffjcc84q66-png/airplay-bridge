<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Scroll Video — riproduci col lo scorrimento</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:#05070a; height:100%;}
  body{overscroll-behavior-y:none; touch-action:pan-y;}

  /* palcoscenico a schermo intero: solo il video */
  #stage{position:fixed; inset:0; z-index:1; background:#05070a;}
  #screen{width:100%; height:100%; display:block; background:#05070a;}

  /* pista di scorrimento (invisibile) */
  #track{width:1px; height:100vh; pointer-events:none;}
</style>
</head>
<body>

  <!-- palcoscenico: solo il video, a schermo intero -->
  <div id="stage">
    <canvas id="screen"></canvas>
  </div>

  <!-- pista: più è lunga, più scroll serve per completare il video -->
  <div id="track"></div>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };

  var stage  = $('#stage');
  var canvas = $('#screen');
  var track  = $('#track');
  var ctx    = canvas.getContext('2d');

  // ---------- stato ----------
  var state = {
    pxPerSec: 350,   // pixel di scroll per 1 secondo di video
    fps: 24,         // frame rate del video (quantizzazione)
    quantize: true
  };

  var video = document.createElement('video');
  video.playsInline = true;
  video.muted = true;
  video.preload = 'auto';
  video.style.display = 'none';
  document.body.appendChild(video);

  // ---------- util ----------
  function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
  function progress(){
    var max = track.offsetHeight - window.innerHeight;
    if (max <= 0) return 0;
    return clamp(window.scrollY / max, 0, 1);
  }

  // ---------- pista di scorrimento ----------
  function setTrackHeight(){
    var d = video.duration;
    if (!isFinite(d) || !d) return;
    track.style.height = Math.max(Math.ceil(d * state.pxPerSec), window.innerHeight*2) + 'px';
  }

  // ---------- rendering ----------
  function resizeCanvas(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(stage.clientWidth  * dpr);
    canvas.height = Math.round(stage.clientHeight * dpr);
    draw();
  }

  function draw(){
    if (video.readyState < 2) return;
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    var cw = canvas.width, ch = canvas.height;
    var scale = Math.max(cw/vw, ch/vh);
    var dw = vw*scale, dh = vh*scale;
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0,0,cw,ch);
    ctx.drawImage(video, (cw-dw)/2, (ch-dh)/2, dw, dh);
  }

  // ---------- sincronizzazione scroll → tempo ----------
  function applyTime(t){
    if (!video.duration) return;
    t = clamp(t, 0, video.duration - 0.001);
    if (state.quantize && state.fps > 0){
      t = clamp(Math.round(t*state.fps)/state.fps, 0, video.duration - 0.001);
    }
    if (Math.abs(video.currentTime - t) > 1e-4) video.currentTime = t;
  }

  document.addEventListener('scroll', function(){
    applyTime(progress() * video.duration);
  }, {passive:true});
  window.addEventListener('resize', resizeCanvas);

  // ---------- sblocco iOS (play+pausa al primo tocco) ----------
  var unlocked = false;
  function unlock(){
    if (unlocked) return;
    unlocked = true;
    var p;
    try { p = video.play(); } catch(e){ return; }
    if (p && p.then){ p.then(function(){ video.pause(); }).catch(function(){}); }
  }
  ['touchstart','scroll','pointerdown'].forEach(function(ev){
    document.addEventListener(ev, unlock, {passive:true});
  });

  // ---------- caricamento ----------
  function loadUrl(url){
    video.src = url;
    video.load();
  }

  function tryAutoLoad(){
    // tenta un video.mp4 accanto al file
    var probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.src = 'video.mp4';
    probe.addEventListener('loadedmetadata', function(){
      loadUrl('video.mp4');
    }, {once:true});
  }

  video.addEventListener('loadedmetadata', function(){
    setTrackHeight();
    resizeCanvas();
  });
  video.addEventListener('durationchange', setTrackHeight);
  video.addEventListener('loadeddata', draw);
  video.addEventListener('seeked', draw);

  // ---------- avvio ----------
  resizeCanvas();
  tryAutoLoad();
})();
</script>
</body>
</html>
